apply plugin: 'com.android.application'

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    namespace = "com.sheldrapps.pdfcovermaker"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sheldrapps.pdfcovermaker"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 33
        versionName "Reliable PDF covers"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    def signingKeystore = new File(System.getProperty('user.home'), '.sheldrapps/android-signing/pcm/upload.keystore')
    def signingPassword = providers.gradleProperty('PCM_SIGNING_PASSWORD').orNull
    signingConfigs {
        release {
            storeFile signingKeystore
            storePassword signingPassword
            keyAlias 'pdfcovermaker'
            keyPassword signingPassword
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel = 'FULL'
            }
        }
    }
}

tasks.matching { task -> task.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        def password = project.providers.gradleProperty('PCM_SIGNING_PASSWORD').orNull
        def keystore = new File(System.getProperty('user.home'), '.sheldrapps/android-signing/pcm/upload.keystore')
        if (password == null || password.toString().trim().isEmpty() || !keystore.isFile()) {
            def missing = []
            if (password == null || password.toString().trim().isEmpty()) missing << 'PCM_SIGNING_PASSWORD in ~/.gradle/gradle.properties'
            if (!keystore.isFile()) missing << keystore.path
            throw new GradleException("PCM release signing is not configured: ${missing.join(', ')}")
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation platform('com.google.firebase:firebase-bom:34.10.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':pdf-rewrite')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

