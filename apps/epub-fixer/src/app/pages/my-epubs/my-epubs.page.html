<ion-header>
  <ion-toolbar>
    <ion-title>{{ 'MY_EPUBS.TITLE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content
  class="ion-padding"
  [scrollEvents]="true"
  (ionScrollStart)="onListScrollStart()"
  (ionScrollEnd)="onListScrollEnd()"
>
  <div class="my-epubs-page__content">
    <sh-cover-list-content
      #listContent
      [items]="items"
      [loading]="loading"
      [pageErrorKey]="pageErrorKey"
      [pageErrorParams]="pageErrorParams"
      [emptyKey]="'MY_EPUBS.EMPTY'"
      [placeholderKey]="'MY_EPUBS.PLACEHOLDER'"
      [showFileName]="true"
      [filenameFormatter]="displayFilename"
      [actions]="listActions"
      thumbAlt="epub cover"
      (refreshRequested)="load($event)"
      (itemClick)="onListItemClick($event)"
      (actionClick)="onListAction($event)"
    ></sh-cover-list-content>
  </div>

</ion-content>
