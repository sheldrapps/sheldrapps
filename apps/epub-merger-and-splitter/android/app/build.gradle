apply plugin: 'com.android.application'

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    namespace = "com.sheldrapps.epubmergersplitter"
    compileSdk = rootProject.ext.compileSdkVersion
    compileOptions {
        coreLibraryDesugaringEnabled true
    }
    defaultConfig {
        applicationId "com.sheldrapps.epubmergersplitter"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20
        versionName "Web EPUB exports"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    def signingKeystore = new File(System.getProperty('user.home'), '.sheldrapps/android-signing/emas/upload.keystore')
    def signingPassword = providers.gradleProperty('EMAS_SIGNING_PASSWORD').orNull
    signingConfigs {
        release {
            storeFile signingKeystore
            storePassword signingPassword
            keyAlias 'upload'
            keyPassword signingPassword
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.matching { task -> task.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        def password = project.providers.gradleProperty('EMAS_SIGNING_PASSWORD').orNull
        def keystore = new File(System.getProperty('user.home'), '.sheldrapps/android-signing/emas/upload.keystore')
        if (password == null || password.toString().trim().isEmpty() || !keystore.isFile()) {
            def missing = []
            if (password == null || password.toString().trim().isEmpty()) missing << 'EMAS_SIGNING_PASSWORD in ~/.gradle/gradle.properties'
            if (!keystore.isFile()) missing << keystore.path
            throw new GradleException("EMAS release signing is not configured: ${missing.join(', ')}")
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation platform('com.google.firebase:firebase-bom:34.10.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':epub-rewrite')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
