<div class="workflow-navigation">
  @if (showPrevious()) {
    <ion-button
      fill="clear"
      class="workflow-navigation__previous app-btn app-btn--icon-row"
      [disabled]="previousDisabled() || nextLoading()"
      (click)="previous.emit()"
    >
      <ion-icon slot="start" [name]="previousIcon()" aria-hidden="true"></ion-icon>
      {{ previousLabel() }}
    </ion-button>
  } @else {
    <span class="workflow-navigation__spacer" aria-hidden="true"></span>
  }

  @if (showNext()) {
  <ion-button
    class="workflow-navigation__primary app-btn app-btn--icon-row"
    [disabled]="nextDisabled() || nextLoading()"
    (click)="next.emit()"
  >
    @if (nextLoading()) {
      <ion-spinner name="crescent" aria-hidden="true"></ion-spinner>
    } @else {
      {{ nextLabel() }}
      <ion-icon slot="end" [name]="nextIcon()" aria-hidden="true"></ion-icon>
    }
  </ion-button>
  } @else {
    <span class="workflow-navigation__spacer" aria-hidden="true"></span>
  }
</div>
