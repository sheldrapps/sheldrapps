@if (visibleActionCount > 0) {
@if (showTitle) {
<div class="field-title">
  {{ resolvedTitleKey | translate }}
</div>
}

<ion-grid class="app-action-grid" [attr.data-tour-id]="tourId || null">
  <ion-row>
    @if (!imageHidden) {
    <ion-col>
      <sh-action-card
        [title]="'COVER_SOURCE.ACTIONS.IMAGE' | translate"
        [description]="'COVER_SOURCE.DESCRIPTIONS.IMAGE' | translate"
        icon="image-outline"
        [disabled]="imageDisabled"
        [suggested]="isSuggestedAction('image')"
        (click)="onSelectImage()"
        [ariaLabel]="'COVER_SOURCE.ARIA.SELECT_IMAGE' | translate"
      ></sh-action-card>
    </ion-col>
    }

    @if (!scratchHidden) {
    <ion-col>
      <sh-action-card
        [title]="'COVER_SOURCE.ACTIONS.SCRATCH' | translate"
        [description]="'COVER_SOURCE.DESCRIPTIONS.SCRATCH' | translate"
        icon="pencil-outline"
        [disabled]="scratchDisabled"
        [suggested]="isSuggestedAction('scratch')"
        (click)="onSelectScratch()"
        [ariaLabel]="'COVER_SOURCE.ARIA.START_SCRATCH' | translate"
      ></sh-action-card>
    </ion-col>
    }

    @if (!currentHidden) {
    <ion-col>
      <sh-action-card
        [title]="'COVER_SOURCE.ACTIONS.CURRENT' | translate"
        [description]="'COVER_SOURCE.DESCRIPTIONS.CURRENT' | translate"
        [imageUrl]="currentImageUrl"
        icon="image-outline"
        [disabled]="currentDisabled"
        [suggested]="isSuggestedAction('current')"
        (click)="onSelectCurrent()"
        [ariaLabel]="'COVER_SOURCE.ARIA.SELECT_CURRENT' | translate"
      ></sh-action-card>
    </ion-col>
    }
  </ion-row>
</ion-grid>
}
